services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kanban_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kanban_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanban_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/kanban_db?schema=public
      JWT_SECRET: super_secret_jwt_key_change_in_production_kanban_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
      SOCKET_CORS_ORIGIN: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
